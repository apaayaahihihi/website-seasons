<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Envelope + Letter (Open/Close on Click)</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="container">
        <div class="envelope-wrapper">
            <div class="envelope">
                <div class="letter">
                    <div class="text">
                        <strong>HALOO DEWI</strong>
                        <p>
                            i dont know where to start tapii yaa gua cuman mau nyampein some feeling yang bisa dibilang udah gua pendam cukup lama
                            gua suka sama lu dew, I'm not sure how it will turns out, tapi yang pasti gua merasa lega udah nyampein ini ke lu
                            feel free yaa buat jawab ini :] take your time dewi!
                        </p>
                    </div>
                </div>
            </div>
            <div class="heart"></div>
        </div>
    </div>
    <script>
        const envelope = document.querySelector('.envelope-wrapper');
        envelope.addEventListener('click', () => {
            envelope.classList.toggle('flap');
        });
    </script>
</body>
</html>
